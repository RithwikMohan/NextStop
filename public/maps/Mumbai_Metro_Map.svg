<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0F172A;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1E293B" />
  <text x="30" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Mumbai Metro (MMRDA) - Official Network Map</text>
  <text x="730" y="42" fill="#0284C7" font-family="sans-serif" font-size="14" font-weight="700">Line 1 Blue Line</text>

  <!-- Background Grid -->
  <defs>
    <pattern id="gridMMRDA" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="70" width="1000" height="580" fill="url(#gridMMRDA)" />

  <!-- LINE 1 BLUE LINE (Versova -> Andheri -> Ghatkopar) -->
  <path d="M 90,320 L 910,320" fill="none" stroke="#0284C7" stroke-width="12" stroke-linecap="round" />

  <!-- STATIONS -->
  <circle cx="90" cy="320" r="10" fill="#0284C7" stroke="#FFF" stroke-width="2" />
  <text x="90" y="290" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Versova (1)</text>

  <circle cx="210" cy="320" r="8" fill="#0284C7" />
  <text x="210" y="290" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">DN Nagar (2)</text>

  <!-- ANDHERI INTERCHANGE HUB -->
  <circle cx="350" cy="320" r="24" fill="rgba(2, 132, 199, 0.25)" stroke="#0284C7" stroke-width="4" />
  <circle cx="350" cy="320" r="12" fill="#FFF" />
  <text x="350" y="275" fill="#FDE68A" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">🔀 Andheri Station Hub</text>
  <text x="350" y="365" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Western Railway &amp; Line 1 Transfer</text>

  <circle cx="490" cy="320" r="8" fill="#0284C7" />
  <text x="490" y="290" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">WEH (4)</text>

  <circle cx="630" cy="320" r="8" fill="#0284C7" />
  <text x="630" y="290" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">Airport Road (5)</text>

  <circle cx="770" cy="320" r="8" fill="#0284C7" />
  <text x="770" y="290" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">Saki Naka (6)</text>

  <circle cx="910" cy="320" r="10" fill="#0284C7" stroke="#FFF" stroke-width="2" />
  <text x="910" y="290" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ghatkopar (7)</text>

  <!-- Legend -->
  <rect x="50" y="500" width="300" height="90" fill="#1E293B" rx="10" stroke="rgba(255,255,255,0.1)" />
  <text x="65" y="525" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="800">MUMBAI METRO LEGEND</text>
  <circle cx="75" cy="550" r="6" fill="#0284C7" />
  <text x="90" y="554" fill="#CBD5E1" font-family="sans-serif" font-size="11">Line 1 (Versova ↔ Andheri ↔ Ghatkopar)</text>
</svg>
