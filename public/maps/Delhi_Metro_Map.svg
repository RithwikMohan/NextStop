<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#0F172A;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1E293B" />
  <text x="30" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Delhi Metro Rail Corporation (DMRC) - Official Network Map</text>
  <text x="750" y="42" fill="#EAB308" font-family="sans-serif" font-size="14" font-weight="700">DMRC System Lines</text>

  <!-- Background Grid -->
  <defs>
    <pattern id="gridDMRC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="70" width="1000" height="630" fill="url(#gridDMRC)" />

  <!-- RED LINE (Rithala -> Kashmere Gate -> Shaheed Sthal) -->
  <path d="M 80,140 L 400,140 L 700,240 L 920,240" fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round" />

  <!-- YELLOW LINE (Samaypur Badli -> Kashmere Gate -> Rajiv Chowk -> Gurugram) -->
  <path d="M 400,90 L 400,620" fill="none" stroke="#EAB308" stroke-width="10" stroke-linecap="round" />

  <!-- BLUE LINE (Dwarka Sec 21 -> Rajiv Chowk -> Noida Electronic City) -->
  <path d="M 80,480 L 400,400 L 920,400" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" />

  <!-- VIOLET LINE (Kashmere Gate -> Mandi House -> Raja Nahar Singh) -->
  <path d="M 400,220 L 520,320 L 520,620" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round" />

  <!-- STATIONS & NUMBERS -->
  <!-- Yellow Line Stations -->
  <circle cx="400" cy="110" r="10" fill="#EAB308" stroke="#FFF" stroke-width="2" />
  <text x="400" y="95" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Samaypur Badli (1)</text>

  <circle cx="400" cy="170" r="8" fill="#EAB308" />
  <text x="430" y="174" fill="#CBD5E1" font-family="sans-serif" font-size="11">Azadpur (3)</text>

  <!-- KASHMERE GATE HUB (Red + Yellow + Violet 3-Line Interchange) -->
  <circle cx="400" cy="220" r="22" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="4" />
  <circle cx="400" cy="220" r="12" fill="#FFF" stroke="#EAB308" stroke-width="3" />
  <text x="400" y="200" fill="#FDE68A" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">🔀 Kashmere Gate Hub</text>
  <text x="400" y="255" fill="#93C5FD" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Red &amp; Yellow &amp; Violet Interchange</text>

  <circle cx="400" cy="290" r="8" fill="#EAB308" />
  <text x="430" y="294" fill="#CBD5E1" font-family="sans-serif" font-size="11">Chandni Chowk (5)</text>

  <circle cx="400" cy="340" r="8" fill="#EAB308" />
  <text x="430" y="344" fill="#CBD5E1" font-family="sans-serif" font-size="11">New Delhi Railway (6)</text>

  <!-- RAJIV CHOWK HUB (Yellow + Blue Interchange) -->
  <circle cx="400" cy="400" r="24" fill="rgba(37, 99, 235, 0.25)" stroke="#2563EB" stroke-width="4" />
  <circle cx="400" cy="400" r="14" fill="#FFF" stroke="#EAB308" stroke-width="3" />
  <text x="400" y="375" fill="#FDE68A" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">🔀 Rajiv Chowk (Connaught Place)</text>
  <text x="400" y="438" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Yellow &amp; Blue Central Hub</text>

  <circle cx="400" cy="520" r="8" fill="#EAB308" />
  <text x="430" y="524" fill="#CBD5E1" font-family="sans-serif" font-size="11">AIIMS (8)</text>

  <circle cx="400" cy="590" r="10" fill="#EAB308" stroke="#FFF" stroke-width="2" />
  <text x="400" y="615" fill="#FDE68A" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Millennium City Centre Gurugram (10)</text>

  <!-- Blue Line Termini -->
  <circle cx="80" cy="480" r="10" fill="#2563EB" stroke="#FFF" stroke-width="2" />
  <text x="80" y="505" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Dwarka Sec 21 (1)</text>

  <circle cx="920" cy="400" r="10" fill="#2563EB" stroke="#FFF" stroke-width="2" />
  <text x="920" y="425" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Noida Electronic City (7)</text>

  <!-- MANDI HOUSE HUB -->
  <circle cx="520" cy="320" r="14" fill="rgba(139, 92, 246, 0.3)" stroke="#8B5CF6" stroke-width="3" />
  <text x="540" y="315" fill="#DDD6FE" font-family="sans-serif" font-size="12" font-weight="700">🔀 Mandi House</text>

  <!-- Legend Box -->
  <rect x="50" y="560" width="280" height="110" fill="#1E293B" rx="10" stroke="rgba(255,255,255,0.1)" />
  <text x="65" y="585" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="800">DELHI METRO LEGEND</text>
  <circle cx="75" cy="605" r="6" fill="#EF4444" />
  <text x="90" y="609" fill="#CBD5E1" font-family="sans-serif" font-size="11">Red Line (Rithala ↔ Shaheed Sthal)</text>
  <circle cx="75" cy="625" r="6" fill="#EAB308" />
  <text x="90" y="629" fill="#CBD5E1" font-family="sans-serif" font-size="11">Yellow Line (Samaypur ↔ Gurugram)</text>
  <circle cx="75" cy="645" r="6" fill="#2563EB" />
  <text x="90" y="649" fill="#CBD5E1" font-family="sans-serif" font-size="11">Blue Line (Dwarka ↔ Noida)</text>
</svg>
