<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0F172A;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1E293B" />
  <text x="30" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Chennai Metro Rail (CMRL) - Official Network Map</text>
  <text x="730" y="42" fill="#2563EB" font-family="sans-serif" font-size="14" font-weight="700">Blue &amp; Green Lines</text>

  <!-- Background Grid -->
  <defs>
    <pattern id="gridCMRL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="70" width="1000" height="580" fill="url(#gridCMRL)" />

  <!-- BLUE LINE (Wimco Nagar -> Central -> Airport) -->
  <path d="M 90,140 L 480,140 L 480,580" fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />

  <!-- GREEN LINE (Central -> St Thomas Mount) -->
  <path d="M 480,140 L 910,140 L 910,580" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" />

  <!-- STATIONS -->
  <circle cx="90" cy="140" r="10" fill="#2563EB" stroke="#FFF" stroke-width="2" />
  <text x="90" y="115" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Wimco Nagar Depot (1)</text>

  <!-- CHENNAI CENTRAL HUB -->
  <circle cx="480" cy="140" r="26" fill="rgba(37, 99, 235, 0.25)" stroke="#2563EB" stroke-width="4" />
  <circle cx="480" cy="140" r="14" fill="#FFF" stroke="#16A34A" stroke-width="4" />
  <text x="480" y="98" fill="#FDE68A" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">🔀 Chennai Central Hub</text>
  <text x="480" y="185" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Blue &amp; Green Line Transfer</text>

  <circle cx="480" cy="270" r="8" fill="#2563EB" />
  <text x="590" y="274" fill="#CBD5E1" font-family="sans-serif" font-size="11">Government Estate (3)</text>

  <circle cx="480" cy="380" r="8" fill="#2563EB" />
  <text x="590" y="384" fill="#CBD5E1" font-family="sans-serif" font-size="11">Teynampet (4)</text>

  <circle cx="480" cy="480" r="8" fill="#2563EB" />
  <text x="590" y="484" fill="#CBD5E1" font-family="sans-serif" font-size="11">Guindy (5)</text>

  <circle cx="480" cy="570" r="10" fill="#2563EB" stroke="#FFF" stroke-width="2" />
  <text x="590" y="574" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700">Chennai International Airport (6)</text>

  <!-- Legend -->
  <rect x="50" y="500" width="300" height="90" fill="#1E293B" rx="10" stroke="rgba(255,255,255,0.1)" />
  <text x="65" y="525" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="800">CHENNAI METRO LEGEND</text>
  <circle cx="75" cy="550" r="6" fill="#2563EB" />
  <text x="90" y="554" fill="#CBD5E1" font-family="sans-serif" font-size="11">Blue Line (Wimco Nagar ↔ Airport)</text>
  <circle cx="75" cy="570" r="6" fill="#16A34A" />
  <text x="90" y="574" fill="#CBD5E1" font-family="sans-serif" font-size="11">Green Line (Central ↔ St. Thomas Mount)</text>
</svg>
