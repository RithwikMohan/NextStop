<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0F172A;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1E293B" />
  <text x="30" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Namma Metro Bengaluru (BMRCL) - Official Network Map</text>
  <text x="730" y="42" fill="#9333EA" font-family="sans-serif" font-size="14" font-weight="700">Purple &amp; Green Lines</text>

  <!-- Background Grid -->
  <defs>
    <pattern id="gridBMRCL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="70" width="1000" height="580" fill="url(#gridBMRCL)" />

  <!-- PURPLE LINE (Whitefield -> Indiranagar -> Majestic -> Challaghatta) -->
  <path d="M 90,320 L 910,320" fill="none" stroke="#9333EA" stroke-width="12" stroke-linecap="round" />

  <!-- GREEN LINE (Nagasandra -> Majestic -> Silk Institute) -->
  <path d="M 480,100 L 480,580" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" />

  <!-- STATIONS -->
  <!-- Purple Line Stations -->
  <circle cx="90" cy="320" r="10" fill="#9333EA" stroke="#FFF" stroke-width="2" />
  <text x="90" y="295" fill="#E9D5FF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Challaghatta (8)</text>

  <circle cx="210" cy="320" r="8" fill="#9333EA" />
  <text x="210" y="295" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">Kengeri (7)</text>

  <circle cx="340" cy="320" r="8" fill="#9333EA" />
  <text x="340" y="295" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">Indiranagar (4)</text>

  <!-- MAJESTIC INTERCHANGE HUB -->
  <circle cx="480" cy="320" r="26" fill="rgba(147, 51, 234, 0.25)" stroke="#9333EA" stroke-width="4" />
  <circle cx="480" cy="320" r="14" fill="#FFF" stroke="#16A34A" stroke-width="4" />
  <text x="480" y="278" fill="#FDE68A" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">🔀 Nadaprabhu Kempegowda (Majestic)</text>
  <text x="480" y="365" fill="#C4B5FD" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Purple &amp; Green Central Transfer Hub</text>

  <circle cx="620" cy="320" r="8" fill="#9333EA" />
  <text x="620" y="295" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">MG Road (5)</text>

  <circle cx="760" cy="320" r="8" fill="#9333EA" />
  <text x="760" y="295" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">ITPL (2)</text>

  <circle cx="910" cy="320" r="10" fill="#9333EA" stroke="#FFF" stroke-width="2" />
  <text x="910" y="295" fill="#E9D5FF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Whitefield (Kadugodi) (1)</text>

  <!-- Green Line Termini -->
  <circle cx="480" cy="110" r="10" fill="#16A34A" stroke="#FFF" stroke-width="2" />
  <text x="590" y="115" fill="#86EFAC" font-family="sans-serif" font-size="12" font-weight="700">Nagasandra (1)</text>

  <circle cx="480" cy="200" r="8" fill="#16A34A" />
  <text x="590" y="204" fill="#CBD5E1" font-family="sans-serif" font-size="11">Yeshwanthpur (2)</text>

  <circle cx="480" cy="450" r="8" fill="#16A34A" />
  <text x="590" y="454" fill="#CBD5E1" font-family="sans-serif" font-size="11">Jayanagar (4)</text>

  <circle cx="480" cy="570" r="10" fill="#16A34A" stroke="#FFF" stroke-width="2" />
  <text x="590" y="574" fill="#86EFAC" font-family="sans-serif" font-size="12" font-weight="700">Silk Institute (5)</text>

  <!-- Legend -->
  <rect x="50" y="510" width="280" height="90" fill="#1E293B" rx="10" stroke="rgba(255,255,255,0.1)" />
  <text x="65" y="535" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="800">NAMMA METRO LEGEND</text>
  <circle cx="75" cy="555" r="6" fill="#9333EA" />
  <text x="90" y="559" fill="#CBD5E1" font-family="sans-serif" font-size="11">Purple Line (Whitefield ↔ Challaghatta)</text>
  <circle cx="75" cy="575" r="6" fill="#16A34A" />
  <text x="90" y="579" fill="#CBD5E1" font-family="sans-serif" font-size="11">Green Line (Nagasandra ↔ Silk Institute)</text>
</svg>
